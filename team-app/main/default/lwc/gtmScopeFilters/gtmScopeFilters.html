<template>
    <div class="bar">
        <div class="f">
            <label>Team / Director</label>
            <select onchange={handleDirector} disabled={error}>
                <template for:each={directorSelectOptions} for:item="d">
                    <option key={d.key} value={d.value} selected={d.selected}>{d.label}</option>
                </template>
            </select>
        </div>
        <div class="f">
            <label>Product type</label>
            <select onchange={handleProduct} disabled={error}>
                <template for:each={productSelectOptions} for:item="d">
                    <option key={d.value} value={d.value} selected={d.selected}>{d.label}</option>
                </template>
            </select>
        </div>
        <div class="f">
            <label>ARR size</label>
            <select onchange={handleSize} disabled={error}>
                <template for:each={sizeSelectOptions} for:item="d">
                    <option key={d.value} value={d.value} selected={d.selected}>{d.label}</option>
                </template>
            </select>
        </div>
        <p class="cap" lwc:if={ready}>{scopeCaption}</p>
        <p class="err" lwc:if={error}>{error}</p>
    </div>
</template>
