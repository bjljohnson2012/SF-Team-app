<template>
    <div class="bar">
        <div class="f">
            <label>Team / Director</label>
            <select value={directorId} onchange={handleDirector} disabled={error}>
                <template for:each={directors} for:item="d">
                    <option key={d.key} value={d.value}>{d.label}</option>
                </template>
            </select>
        </div>
        <div class="f">
            <label>Product type</label>
            <select value={productType} onchange={handleProduct} disabled={error}>
                <template for:each={productTypes} for:item="d">
                    <option key={d.value} value={d.value}>{d.label}</option>
                </template>
            </select>
        </div>
        <div class="f">
            <label>ARR size</label>
            <select value={sizeBand} onchange={handleSize} disabled={error}>
                <template for:each={sizeBands} for:item="d">
                    <option key={d.value} value={d.value}>{d.label}</option>
                </template>
            </select>
        </div>
        <p class="cap" lwc:if={ready}>{scopeCaption}</p>
        <p class="err" lwc:if={error}>{error}</p>
    </div>
</template>
