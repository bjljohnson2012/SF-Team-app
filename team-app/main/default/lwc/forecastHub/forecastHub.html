<template>
    <div class="fh-header">
        <h1>Forecast Submission Cockpit</h1>
        <p class="sub">Director view &middot; team pipeline scored live from Salesforce, recomputed on refresh.</p>
    </div>
    <div class="fh-bar"></div>

    <template lwc:if={loading}>
        <div class="fh-body"><lightning-spinner size="small" alternative-text="Loading"></lightning-spinner></div>
    </template>

    <template lwc:if={error}>
        <div class="fh-body"><div class="err">{error}</div></div>
    </template>

    <template lwc:if={noData}>
        <div class="fh-body"><div class="box"><p>No open new-business opportunities found for your team in the current window.</p></div></div>
    </template>

    <template lwc:if={hasData}>
        <div class="fh-ctl">
            <div class="fh-f"><label>High %</label><input type="number" min="0" max="100" value={wHi} onchange={handleWHi}></div>
            <div class="fh-f"><label>Med %</label><input type="number" min="0" max="100" value={wMed} onchange={handleWMed}></div>
            <div class="fh-f"><label>Pull-in %</label><input type="number" min="0" max="100" value={wPull} onchange={handleWPull}></div>
            <span class="fh-status"><b>Live.</b> {statusText}</span>
        </div>

        <div class="fh-nav">
            <template for:each={tabs} for:item="t">
                <button key={t.id} class={t.cls} data-t={t.id} onclick={handleTab}>{t.label}</button>
            </template>
        </div>

        <div class="fh-body">
            <!-- Summary -->
            <template lwc:if={isSummary}>
                <h2>Forecast summary</h2>
                <p class="lede">Your team's modeled call, driven by the evidence score and the strike-rate weights above. Seeded judgment overrides from the deep dive are already applied.</p>
                <div class="cards">
                    <div class="card hero"><div class="lab">Current Qtr call ({summary.qA})</div><div class="val">{summary.currentCall}</div><div class="note">High &times; {wHi}% + Med &times; {wMed}%</div></div>
                    <div class="card hero"><div class="lab">Next Qtr call ({summary.qB})</div><div class="val">{summary.nextCall}</div><div class="note">weighted, picked deals</div></div>
                    <div class="card"><div class="lab">Combined call</div><div class="val">{summary.combined}</div></div>
                    <div class="card"><div class="lab">Team AEs</div><div class="val">{summary.teamSize}</div><div class="note">{summary.dealCount} open deals in window</div></div>
                </div>
                <div class="cards">
                    <div class="card good"><div class="lab">Include-High ({summary.qA})</div><div class="val">{summary.hi}</div></div>
                    <div class="card warn"><div class="lab">Include-Med ({summary.qA})</div><div class="val">{summary.md}</div></div>
                    <div class="card"><div class="lab">Exclude ({summary.qA})</div><div class="val">{summary.ex}</div></div>
                </div>
                <div class="box info"><h4>How the call is built</h4><p>Every deal is scored on stage, pricing, next step, real activity, SQL gate and close-date pushes. High and Med deals are "in the call" by default; tick or untick on the Current/Next Qtr tabs. The call applies your strike rates to the picked ARR by class.</p></div>
            </template>

            <!-- Current Qtr -->
            <template lwc:if={isCurrent}>
                <h2>Current quarter &mdash; {summary.qA}</h2>
                <div class="fh-f" style="max-width:220px"><label>Filter by AE</label>
                    <select onchange={handleAe}>
                        <template for:each={aeOptions} for:item="o"><option key={o.v} value={o.v} selected={o.sel}>{o.label}</option></template>
                    </select></div>
                <div class="chips">
                    <template for:each={classChips} for:item="c"><button key={c.v} class={c.cls} data-v={c.v} onclick={handleChip}>{c.label}</button></template>
                </div>
                <div class="builder">
                    <div class="it"><span class="k">Picked deals</span><span class="v">{currentTotals.n}</span></div>
                    <div class="it"><span class="k">Picked ARR</span><span class="v">{currentTotals.arr}</span></div>
                    <div class="it"><span class="k">Modeled call</span><span class="v g">{currentTotals.call}</span></div>
                    <button class="fh-btn gh" style="margin-left:auto" onclick={applyDefaults}>Set call = engine defaults</button>
                </div>
                <div class="tw">
                    <table>
                        <thead><tr>
                            <th class="cb"></th><th>Account</th><th>AE</th><th>Stage</th><th>Band</th>
                            <th class="num">ARR</th><th>Class</th><th class="num">Score</th><th>Signals</th>
                        </tr></thead>
                        <tbody>
                            <template for:each={currentRows} for:item="d">
                                <tr key={d.id} class={d.rowClass}>
                                    <td class="cb"><input type="checkbox" class="chk" checked={d.picked} data-id={d.id} onchange={handlePick}></td>
                                    <td><a href={d.url} target="_blank">{d.account}</a>
                                        <template lwc:if={d.hasNote}><div class="ovnote">{d.note}</div></template></td>
                                    <td>{d.ae}</td>
                                    <td>{d.stage}</td>
                                    <td><span class={d.bandPill}>{d.band}</span></td>
                                    <td class="num">{d.arrFmt}</td>
                                    <td><select class={d.selClass} data-id={d.id} onchange={handleClass}>
                                        <template for:each={d.clsOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select></td>
                                    <td class="num">{d.score}</td>
                                    <td class="small">{d.reason}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- Next Qtr -->
            <template lwc:if={isNext}>
                <h2>Next quarter &mdash; {summary.qB}</h2>
                <div class="fh-f" style="max-width:220px"><label>Filter by AE</label>
                    <select onchange={handleAe}>
                        <template for:each={aeOptions} for:item="o"><option key={o.v} value={o.v} selected={o.sel}>{o.label}</option></template>
                    </select></div>
                <div class="chips">
                    <template for:each={classChips} for:item="c"><button key={c.v} class={c.cls} data-v={c.v} onclick={handleChip}>{c.label}</button></template>
                </div>
                <div class="builder">
                    <div class="it"><span class="k">Picked deals</span><span class="v">{nextTotals.n}</span></div>
                    <div class="it"><span class="k">Picked ARR</span><span class="v">{nextTotals.arr}</span></div>
                    <div class="it"><span class="k">Modeled call</span><span class="v g">{nextTotals.call}</span></div>
                    <button class="fh-btn gh" style="margin-left:auto" onclick={applyDefaults}>Set call = engine defaults</button>
                </div>
                <div class="tw">
                    <table>
                        <thead><tr>
                            <th class="cb"></th><th>Account</th><th>AE</th><th>Stage</th><th>Band</th>
                            <th class="num">ARR</th><th>Class</th><th class="num">Score</th><th>Signals</th>
                        </tr></thead>
                        <tbody>
                            <template for:each={nextRows} for:item="d">
                                <tr key={d.id} class={d.rowClass}>
                                    <td class="cb"><input type="checkbox" class="chk" checked={d.picked} data-id={d.id} onchange={handlePick}></td>
                                    <td><a href={d.url} target="_blank">{d.account}</a>
                                        <template lwc:if={d.hasNote}><div class="ovnote">{d.note}</div></template></td>
                                    <td>{d.ae}</td>
                                    <td>{d.stage}</td>
                                    <td><span class={d.bandPill}>{d.band}</span></td>
                                    <td class="num">{d.arrFmt}</td>
                                    <td><select class={d.selClass} data-id={d.id} onchange={handleClass}>
                                        <template for:each={d.clsOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select></td>
                                    <td class="num">{d.score}</td>
                                    <td class="small">{d.reason}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- Pull-Ins -->
            <template lwc:if={isPull}>
                <h2>Pull-in candidates</h2>
                <p class="lede">Future deals with a case for counting them earlier &mdash; and the case against. Both sides are kept on the record; a pull-in list without the case against is a wish list.</p>
                <template for:each={pullRows} for:item="p">
                    <div key={p.id} class="box">
                        <h4><a href={p.url} target="_blank">{p.account}</a> <span class={p.targetPill}>{p.target}</span> <span class="small">{p.arrFmt}</span></h4>
                        <p><span class="pi-for">For:</span> {p.caseFor}</p>
                        <p><span class="pi-against">Against:</span> {p.caseAgainst}</p>
                    </div>
                </template>
            </template>

            <!-- Created Pipeline -->
            <template lwc:if={isCreated}>
                <h2>Created pipeline</h2>
                <p class="lede">New-business bookings (won ARR by close quarter) against pipeline creation (ARR dated by the SQL gate), your team, trailing 8 quarters.</p>
                <template lwc:if={hasCreated}>
                    <div class="tw"><table>
                        <thead><tr><th>Quarter</th><th class="num">Created #</th><th class="num">Created ARR</th><th class="num">Booked #</th><th class="num">Booked ARR</th></tr></thead>
                        <tbody>
                            <template for:each={createdDisplay} for:item="r">
                                <tr key={r.label}><td>{r.label}</td><td class="num">{r.createdN}</td><td class="num">{r.createdArr}</td><td class="num">{r.bookedN}</td><td class="num">{r.bookedArr}</td></tr>
                            </template>
                        </tbody>
                    </table></div>
                </template>
                <template lwc:else><div class="box"><p>No closed/created history in range for your team.</p></div></template>
            </template>

            <!-- Conversion Metrics -->
            <template lwc:if={isConversion}>
                <h2>Conversion metrics</h2>
                <p class="lede">Win rate by the forecast band the deal held before it closed &mdash; by deal count and by ARR &mdash; your team, trailing 8 quarters. This is the band-to-close conversion the call weights should reflect.</p>
                <template lwc:if={hasConversion}>
                    <div class="tw"><table>
                        <thead><tr><th>Band (before close)</th><th class="num">Deals</th><th class="num">Won</th><th class="num">Win rate</th><th class="num">Total ARR</th><th class="num">Won ARR</th><th class="num">Win rate ($)</th></tr></thead>
                        <tbody>
                            <template for:each={conversionDisplay} for:item="r">
                                <tr key={r.band}><td><span class={r.bandPill}>{r.band}</span></td><td class="num">{r.total}</td><td class="num">{r.won}</td><td class="num">{r.winRate}</td><td class="num">{r.totalArr}</td><td class="num">{r.wonArr}</td><td class="num">{r.winRateArr}</td></tr>
                            </template>
                        </tbody>
                    </table></div>
                </template>
                <template lwc:else><div class="box"><p>No closed history in range for your team.</p></div></template>
            </template>

            <!-- Win Rate Truth -->
            <template lwc:if={isWinRate}>
                <h2>Win rate truth</h2>
                <p class="lede">Creation-cohort win rates that follow opportunities forward from the SQL gate, not backward from close. Four denominators, because each answers a different question &mdash; and they disagree on purpose.</p>
                <div class="box info"><h4>Reading the four rates</h4><p><strong>Cohort</strong> = won / everything created. <strong>Resolved</strong> = won / everything settled. <strong>Contested</strong> = won / real deals only (unqualified &amp; duplicates removed). <strong>Qual yield</strong> = share of created pipeline that was ever real.</p></div>
                <template lwc:if={hasWin}>
                    <div class="tw"><table>
                        <thead><tr><th>Cohort (SQL qtr)</th><th class="num">Created</th><th class="num">Won</th><th class="num">Worked</th><th class="num">Never-real</th><th class="num">Open</th><th class="num">Cohort WR</th><th class="num">Resolved WR</th><th class="num">Contested WR</th><th class="num">Qual yield</th></tr></thead>
                        <tbody>
                            <template for:each={winDisplay} for:item="r">
                                <tr key={r.label} class={r.rowClass}><td>{r.label}</td><td class="num">{r.created}</td><td class="num">{r.won}</td><td class="num">{r.worked}</td><td class="num">{r.never}</td><td class="num">{r.stillOpen}</td><td class="num">{r.cohortWR}</td><td class="num">{r.resolvedWR}</td><td class="num">{r.contestedWR}</td><td class="num">{r.qualYield}</td></tr>
                            </template>
                        </tbody>
                    </table></div>
                </template>
                <template lwc:else><div class="box"><p>No creation-cohort data in range for your team.</p></div></template>
            </template>

            <!-- AE by AE -->
            <template lwc:if={isAe}>
                <h2>AE by AE</h2>
                <p class="lede">Closed-business conversion per rep (trailing 24 months, duplicates excluded), with the dominant loss root cause &mdash; where each rep's deals are actually dying.</p>
                <template lwc:if={hasAe}>
                    <div class="tw"><table>
                        <thead><tr><th>AE</th><th class="num">Won</th><th class="num">Won ARR</th><th class="num">Lost</th><th class="num">Lost ARR</th><th class="num">Win rate</th><th>Top loss cause</th></tr></thead>
                        <tbody>
                            <template for:each={aeDisplay} for:item="r">
                                <tr key={r.ae}><td>{r.ae}</td><td class="num">{r.won}</td><td class="num">{r.wonArr}</td><td class="num">{r.lost}</td><td class="num">{r.lostArr}</td><td class="num">{r.winRate}</td><td>{r.topRoot}</td></tr>
                            </template>
                        </tbody>
                    </table></div>
                </template>
                <template lwc:else><div class="box"><p>No closed history in range for your team.</p></div></template>
            </template>
        </div>
    </template>
</template>
