<template>
    <lightning-card title="Forecasting Hub" icon-name="standard:forecasts">
        <div class="slds-p-horizontal_small slds-p-bottom_small">
            <template lwc:if={loading}>
                <lightning-spinner size="small" alternative-text="Loading forecast"></lightning-spinner>
            </template>

            <template lwc:if={error}>
                <div class="slds-text-color_error slds-p-around_small">{error}</div>
            </template>

            <template lwc:if={hasData}>
                <div class="slds-grid slds-gutters slds-wrap slds-p-bottom_small">
                    <div class="slds-col slds-size_6-of-12 slds-medium-size_3-of-12">
                        <div class="slds-box slds-box_x-small">
                            <p class="slds-text-title_caps slds-text-color_weak">Team</p>
                            <p class="slds-text-heading_medium">{teamSize}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_6-of-12 slds-medium-size_3-of-12">
                        <div class="slds-box slds-box_x-small">
                            <p class="slds-text-title_caps slds-text-color_weak">Open deals</p>
                            <p class="slds-text-heading_medium">{dealCount}</p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_6-of-12 slds-medium-size_3-of-12">
                        <div class="slds-box slds-box_x-small">
                            <p class="slds-text-title_caps slds-text-color_weak">Include-High ARR</p>
                            <p class="slds-text-heading_medium">
                                <lightning-formatted-number value={highArr} format-style="currency"
                                    currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                            </p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_6-of-12 slds-medium-size_3-of-12">
                        <div class="slds-box slds-box_x-small">
                            <p class="slds-text-title_caps slds-text-color_weak">Modeled call</p>
                            <p class="slds-text-heading_medium">
                                <lightning-formatted-number value={modeledCall} format-style="currency"
                                    currency-code="USD" maximum-fraction-digits="0"></lightning-formatted-number>
                            </p>
                        </div>
                    </div>
                </div>

                <p class="slds-text-body_small slds-text-color_weak slds-p-bottom_x-small">
                    Window {quarterLabel} &middot; scored on stage, pricing, next step, activity, SQL gate
                    &amp; close-date pushes. MEDDPICC depth and materialized scores arrive with the nightly batch.
                </p>

                <lightning-datatable
                    key-field="id"
                    data={data}
                    columns={columns}
                    hide-checkbox-column
                    column-widths-mode="auto">
                </lightning-datatable>
            </template>

            <template lwc:if={noData}>
                <div class="slds-p-around_small slds-text-color_weak">
                    No open new-business opportunities found for your team in the current window.
                </div>
            </template>
        </div>
    </lightning-card>
</template>
