<template>
    <div class="wrap">
        <h2>Waterfall</h2>
        <p class="lede">
            Two clocks. The <strong>close plan</strong> is what has to convert from the book that already exists
            to hit this period. The <strong>create plan</strong> is what has to be created now, aimed at the
            quarter this quarter’s activity actually lands in. Dialling does not fix the first clock.
        </p>

        <c-gtm-scope-filters grouped-products onscopechange={handleScope}></c-gtm-scope-filters>

        <template lwc:if={loading}>
            <div class="box">
                <lightning-spinner size="small" alternative-text="Loading waterfall"></lightning-spinner>
                <p class="note">Calibrating rates and reading actuals…</p>
            </div>
        </template>
        <template lwc:if={error}><div class="err">{error}</div></template>

        <template lwc:if={page}>
            <p class="caption">{scopeCaption}</p>
            <p class="note">{teamCaption}</p>
            <p class="note">
                Close period {periodLabel}. Create period {createPeriodLabel} (this period plus median cycle).
                {remainingDaysLabel}
            </p>

            <template lwc:if={emptyReason}>
                <div class="box">{emptyReason}</div>
            </template>

            <template lwc:if={hasRows}>
                <template for:each={cards} for:item="c">
                    <article key={c.ownerId} class="ae">
                        <header class="head">
                            <h3>{c.name}</h3>
                            <span class={c.pillClass}>{c.sampleConfidence}</span>
                            <span class="meta">{c.closedCount} gated closes · quota {c.quota}</span>
                            <button
                                type="button"
                                class="plan-btn"
                                data-owner={c.ownerId}
                                aria-expanded={c.plannerOpen}
                                onclick={togglePlanner}
                            >Help plan the plays needed</button>
                        </header>

                        <div class="plans">
                            <div class={c.closePlan.kindClass}>
                                <p class="plan-tag">Clock 1 · this period</p>
                                <h4>Close plan</h4>
                                <p class="lever">{c.closePlan.lever}</p>
                                <template for:each={c.closePlan.rungs} for:item="r">
                                    <div key={r.key} class={r.rungClass} data-depth={r.depth}>
                                        <div>
                                            <p class="name">{r.name}</p>
                                            <p class="op">{r.op}</p>
                                        </div>
                                        <span class="val">{r.value}</span>
                                    </div>
                                </template>
                                <p class="have">Have {c.have} open qualified · {c.haveArr}. Req QO {c.reqQo}.</p>
                            </div>
                            <div class={c.createPlan.kindClass}>
                                <p class="plan-tag">Clock 2 · period + cycle</p>
                                <h4>Create plan</h4>
                                <p class="lever">{c.createPlan.lever}</p>
                                <template for:each={c.createPlan.rungs} for:item="r">
                                    <div key={r.key} class={r.rungClass} data-depth={r.depth}>
                                        <div>
                                            <p class="name">{r.name}</p>
                                            <p class="op">{r.op}</p>
                                        </div>
                                        <span class="val">{r.value}</span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="tw">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Win raw</th><th>Win blended</th>
                                        <th>ASP raw</th><th>ASP blended</th>
                                        <th>Cycle</th><th>Lands</th>
                                        <th>Qual</th><th>Self mix</th><th>Connect</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="num">{c.winRateRaw}</td>
                                        <td class="num">{c.winRateBlended}</td>
                                        <td class="num">{c.aspRaw}</td>
                                        <td class="num">{c.aspBlended}</td>
                                        <td class="num">{c.cycle}</td>
                                        <td class="num">{c.lands}</td>
                                        <td class="num">{c.qualRate}</td>
                                        <td class="num">{c.selfMix}</td>
                                        <td class="num">{c.connectRate}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <p class="note">
                            This period: {c.created} created, {c.dials} dispositioned dials, {c.connects} connects,
                            {c.emailsSent} emails, {c.replies} inbound replies (thread traffic, not cold reply rate),
                            {c.meetingsHeld} meetings held.
                            <template lwc:if={c.activityIndicative}>
                                Activity rows are indicative only — disposition coverage {c.activityComplete} is below 70%.
                            </template>
                        </p>

                        <template lwc:if={c.plannerOpen}>
                            <section class="plays" aria-label="Play plan">
                                <h4>Play plan</h4>
                                <p class="lever">
                                    Dials cover the create clock — the self-sourced slice of everything that must
                                    be created. They do not close the qualified book that already exists.
                                </p>

                                <div class="play-grid">
                                    <div class="play-box">
                                        <p class="plan-tag">Their normal</p>
                                        <p class="play-big">{c.plan.normalDialsWeek}</p>
                                        <p class="op">dials / week so far · connect rate {c.plan.normalConnectRate}</p>
                                        <p class="op">{c.dials} dispositioned dials · {c.connects} connects · {c.created} created</p>
                                    </div>
                                    <div class="play-box">
                                        <p class="plan-tag">How often, remaining</p>
                                        <p class="play-big">{c.plan.dialsWeek}</p>
                                        <p class="op">dials / week to hit your plan · {c.plan.dialsDay} / day</p>
                                        <p class="op">{c.plan.remainingDays} working days left · {c.plan.remainingWeeks} weeks · vs normal {c.plan.paceGap}</p>
                                    </div>
                                </div>

                                <div class="lanes">
                                    <div class="lane">
                                        <p class="plan-tag">Qualified opps · this period</p>
                                        <p class="play-big">{c.plan.qoNeeded}</p>
                                        <p class="op">Need {c.plan.qoNeeded} QO · have {c.have} open qualified ({c.haveArr})</p>
                                        <p class={c.plan.qoGapClass}>{c.plan.qoGapLabel}</p>
                                    </div>
                                    <div class="lane live">
                                        <p class="plan-tag">Everything to create · lands {createPeriodLabel}</p>
                                        <p class="play-big">{c.plan.oppsToCreate}</p>
                                        <p class="op">All opps {c.plan.oppsToCreate} · self-sourced {c.plan.selfSourced} · channel {c.plan.channelOpps}</p>
                                        <p class="op">Channel remainder is marketing, BDR and partners — not this AE’s dials.</p>
                                    </div>
                                </div>

                                <p class="note">Edit a recommended number. The rest of the cascade and the outcome move with it.</p>
                                <div class="tw">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Number</th>
                                                <th class="num">Engine</th>
                                                <th class="num">Your plan</th>
                                                <th>What this is</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td>Dials</td>
                                                <td class="num">{c.rec.dials}</td>
                                                <td><input class="plan-in" type="number" min="0" step="1" value={c.plan.dials} data-owner={c.ownerId} data-field="dials" onchange={handlePlanField}></td>
                                                <td class="op">Dispositioned Salesloft calls only</td>
                                            </tr>
                                            <tr>
                                                <td>Connects</td>
                                                <td class="num">{c.rec.connects}</td>
                                                <td><input class="plan-in" type="number" min="0" step="0.1" value={c.plan.connects} data-owner={c.ownerId} data-field="connects" onchange={handlePlanField}></td>
                                                <td class="op">Connected dispositions</td>
                                            </tr>
                                            <tr>
                                                <td>Connect rate %</td>
                                                <td class="num">{c.rec.connectRate}</td>
                                                <td><input class="plan-in" type="number" min="0" max="100" step="0.1" value={c.plan.connectRate} data-owner={c.ownerId} data-field="connectRate" data-kind="pct" onchange={handlePlanField}></td>
                                                <td class="op">Their normal is {c.plan.normalConnectRate}</td>
                                            </tr>
                                            <tr>
                                                <td>Opps per connect</td>
                                                <td class="num">{c.rec.oppsPerConnect}</td>
                                                <td><input class="plan-in" type="number" min="0" step="0.01" value={c.plan.oppsPerConnect} data-owner={c.ownerId} data-field="oppsPerConnect" onchange={handlePlanField}></td>
                                                <td class="op">Self-sourced creates ÷ connects</td>
                                            </tr>
                                            <tr>
                                                <td>Self mix %</td>
                                                <td class="num">{c.rec.selfShare}</td>
                                                <td><input class="plan-in" type="number" min="0" max="100" step="0.1" value={c.plan.selfShare} data-owner={c.ownerId} data-field="selfShare" data-kind="pct" onchange={handlePlanField}></td>
                                                <td class="op">AE Outbound + AM share of everything</td>
                                            </tr>
                                            <tr>
                                                <td>All opps to create</td>
                                                <td class="num">{c.rec.oppsToCreate}</td>
                                                <td><input class="plan-in" type="number" min="0" step="0.1" value={c.plan.oppsToCreate} data-owner={c.ownerId} data-field="oppsToCreate" onchange={handlePlanField}></td>
                                                <td class="op">Everything, every source</td>
                                            </tr>
                                            <tr>
                                                <td>Qualified opps</td>
                                                <td class="num">{c.rec.qoNeeded}</td>
                                                <td><input class="plan-in" type="number" min="0" step="0.1" value={c.plan.qoNeeded} data-owner={c.ownerId} data-field="qoNeeded" onchange={handlePlanField}></td>
                                                <td class="op">SQL-stamped book for the close clock</td>
                                            </tr>
                                            <tr>
                                                <td>Qual rate %</td>
                                                <td class="num">{c.rec.qualRate}</td>
                                                <td><input class="plan-in" type="number" min="0" max="100" step="0.1" value={c.plan.qualRate} data-owner={c.ownerId} data-field="qualRate" data-kind="pct" onchange={handlePlanField}></td>
                                                <td class="op">CreatedDate cohort that ever got a SQL stamp</td>
                                            </tr>
                                            <tr>
                                                <td>Win rate %</td>
                                                <td class="num">{c.rec.winRate}</td>
                                                <td><input class="plan-in" type="number" min="0" max="100" step="0.1" value={c.plan.winRate} data-owner={c.ownerId} data-field="winRate" data-kind="pct" onchange={handlePlanField}></td>
                                                <td class="op">Blended, gated</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <div class="outcomes">
                                    <div class="play-box">
                                        <p class="plan-tag">If they hit your plan</p>
                                        <p class="play-big">{c.plan.projectedArr}</p>
                                        <p class="op">{c.plan.winsNeeded} wins · {c.plan.coverage} of quota {c.quota}</p>
                                    </div>
                                    <div class="play-box">
                                        <p class="plan-tag">Versus engine recommended</p>
                                        <p class={c.plan.deltaClass}>{c.plan.arrDelta}</p>
                                        <p class="op">{c.plan.dialDelta} dials · {c.plan.qoDelta} qualified opps</p>
                                    </div>
                                </div>

                                <div class="play-actions">
                                    <label class="reason">
                                        <span>Reason</span>
                                        <input type="text" maxlength="255" placeholder="Why these numbers" data-owner={c.ownerId} value={c.plan.reason} onchange={handleReason}>
                                    </label>
                                    <button type="button" class="plan-btn ghost" data-owner={c.ownerId} onclick={resetPlanner} disabled={c.plan.saving}>Reset to engine</button>
                                    <button type="button" class="plan-btn" data-owner={c.ownerId} onclick={savePlanner} disabled={c.plan.saving}>Save recommended numbers</button>
                                    <span class="note">{c.plan.saveMsg}</span>
                                </div>
                            </section>
                        </template>
                    </article>
                </template>
            </template>
        </template>
    </div>
</template>
