<template>
    <div class="pr-header">
        <h1>Pricing Review View Checklist Tool</h1>
        <p class="sub">Run a pricing review on an open opportunity; the checklist is generated as a Word document and attached to the opportunity's Files.</p>
    </div>
    <div class="pr-bar"></div>

    <div class="pr-body">
        <template lwc:if={error}><div class="err">{error}</div></template>
        <template lwc:if={done}><div class="box ok">{done}</div></template>

        <template lwc:if={selected}>
            <div class="box builder-box">
                <h3>Pricing Review Checklist &mdash; {selected.account}</h3>
                <p class="small">Answer the 24 questions below (Lead Source is pre-filled from Salesforce). Blanks are flagged &#9888; NOT ANSWERED in the generated doc so your Director sees what's missing.</p>
                <template for:each={questionGroups} for:item="g">
                    <div key={g.label} class="batch">
                        <div class="batch-h">{g.label}</div>
                        <template for:each={g.items} for:item="q">
                            <div key={q.key} class="fld"><label>{q.key}. {q.label}</label><textarea data-q={q.key} value={q.value} onchange={setAnswer}></textarea></div>
                        </template>
                    </div>
                </template>
                <div class="actions">
                    <button class="pr-btn" onclick={create} disabled={saving}>Create pricing review checklist</button>
                    <button class="pr-btn gh" onclick={cancel}>Cancel</button>
                    <template lwc:if={saving}><span class="pr-spin"></span> Generating &amp; attaching Word doc&hellip;</template>
                </div>
            </div>
        </template>

        <div class="cards">
            <div class="card"><div class="lab">Open deals</div><div class="val">{openCount}</div></div>
            <div class="card"><div class="lab">Reviews done</div><div class="val">{doneCount}</div></div>
        </div>

        <template lwc:if={hasRows}>
            <div class="tw"><table>
                <thead><tr><th>Account</th><th>AE</th><th>Stage</th><th class="num">ARR</th><th>Close</th><th>Pricing review</th><th></th></tr></thead>
                <tbody><template for:each={rows} for:item="d"><tr key={d.id}>
                    <td>{d.account}</td><td>{d.ae}</td><td>{d.stage}</td><td class="num">{d.arrFmt}</td><td>{d.closeDate}</td>
                    <td><span class={d.statusPill}>{d.statusLabel}</span></td>
                    <td><button class="pr-btn sm" data-id={d.id} onclick={pick}>Create pricing review checklist</button></td>
                </tr></template></tbody>
            </table></div>
        </template>
        <template lwc:else><div class="box"><p>No open new-business opportunities found for you or your team.</p></div></template>
    </div>
</template>
