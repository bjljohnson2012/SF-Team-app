<template>
    <div class="pr-wrap">
        <div class="pr-head">
            <div>
                <h2>Pipeline Review</h2>
                <p class="pr-sub">Stored grades. Zero AI on load. Filters are SOQL.</p>
            </div>
        </div>
        <template lwc:if={loading}><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></template>
        <template lwc:if={error}><div class="pr-banner">{error}</div></template>
        <template lwc:if={truncated}><div class="pr-banner">Loaded {loaded} of {expected}. History fetch truncated — retry.</div></template>
        <c-gtm-scope-filters grouped-products onscopechange={onScope}></c-gtm-scope-filters>
        <c-pipeline-review-filters aes={aes} onfilterchange={onFilter}></c-pipeline-review-filters>
        <c-pipeline-review-saved-views views={views} onviewload={onViewLoad} onviewsave={onViewSave}
            onviewdup={onViewDup} onviewdel={onViewDel}></c-pipeline-review-saved-views>
        <c-pipeline-review-toolbar last-updated={lastUpdated} banner={runBanner} skip-line={skipLine}
            onregen={onRegen} onexport={onExport}></c-pipeline-review-toolbar>
        <c-pipeline-review-table rows={displayRows} onsort={onSort} onpick={onPick} ontag={onTag} onopen={onOpen}></c-pipeline-review-table>
        <div class="pr-foot"><span>{loaded} / {expected} deals</span><span>{arrLabel}</span></div>
        <c-pipeline-review-drawer row={drawer} preview={preview} error={drawerError}
            onsavenote={onSaveNote} onregenone={onRegenOne} onclose={onClose}></c-pipeline-review-drawer>
    </div>
</template>
