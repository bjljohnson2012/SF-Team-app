<template>
    <div class="card">
        <div class="grid">
            <div class="f"><label>Director</label>
                <select data-k="directorId" onchange={onDirector}>
                    <option value="">My team</option>
                    <template for:each={directorOptions} for:item="o">
                        <option key={o.id} value={o.id}>{o.name}</option>
                    </template>
                </select>
            </div>
            <div class="f"><label>Account Executive</label>
                <select data-k="ownerId" onchange={onAe}>
                    <option value="">All AEs</option>
                    <template for:each={aes} for:item="a">
                        <option key={a.id} value={a.id}>{a.name}</option>
                    </template>
                </select>
            </div>
            <div class="f"><label>Stage</label>
                <select data-k="stage" onchange={onStage}>
                    <option value="">All stages</option>
                    <template for:each={stages} for:item="s">
                        <option key={s} value={s}>{s}</option>
                    </template>
                </select>
            </div>
            <div class="f"><label>Solution</label>
                <select data-k="solution" onchange={onSolution}>
                    <option value="">All solutions</option>
                    <template for:each={solutions} for:item="s">
                        <option key={s} value={s}>{s}</option>
                    </template>
                </select>
            </div>
            <div class="f"><label>Tag</label>
                <select data-k="tag" onchange={onTag}>
                    <option value="">All tags</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="UNTAGGED">Untagged</option>
                </select>
            </div>
            <div class="f"><label>Staleness</label>
                <select data-k="staleness" onchange={onStale}>
                    <option value="">Any staleness</option>
                    <option value="current">Current (≤7d)</option>
                    <option value="recent">Recent (8–21d)</option>
                    <option value="aging">Aging (22–45d)</option>
                    <option value="history">History (45d+)</option>
                    <option value="unknown">Unknown</option>
                </select>
            </div>
            <div class="f"><label>Run state</label>
                <select data-k="runState" onchange={onRun}>
                    <option value="">Any run state</option>
                    <option value="never">Never generated</option>
                    <option value="today">Generated today</option>
                    <option value="stale">Stale</option>
                </select>
            </div>
            <div class="f"><label>Next step</label>
                <select data-k="nextStep" onchange={onNext}>
                    <option value="">Any next step</option>
                    <option value="Missing">Missing</option>
                    <option value="PastDue">Past due</option>
                    <option value="Parked">Parked</option>
                    <option value="Healthy">Healthy</option>
                </select>
            </div>
            <div class="f"><label>AE call</label>
                <select data-k="aeForecast" onchange={onAeFc}>
                    <option value="">Any AE call</option>
                    <template for:each={forecasts} for:item="v"><option key={v} value={v}>{v}</option></template>
                </select>
            </div>
            <div class="f"><label>Director forecast</label>
                <select data-k="directorForecast" onchange={onDirFc}>
                    <option value="">Any director</option>
                    <template for:each={forecasts} for:item="v"><option key={v} value={v}>{v}</option></template>
                </select>
            </div>
            <div class="f"><label>Recommended</label>
                <select data-k="recommended" onchange={onRec}>
                    <option value="">Any recommended</option>
                    <template for:each={forecasts} for:item="v"><option key={v} value={v}>{v}</option></template>
                </select>
            </div>
            <div class="f"><label>Close date</label>
                <select data-k="closePreset" onchange={onClose}>
                    <option value="">All</option>
                    <option value="thisQ">This quarter</option>
                    <option value="nextQ">Next quarter</option>
                    <option value="thisM">This month</option>
                    <option value="past">Past due</option>
                </select>
            </div>
            <div class="f arr"><label>ARR range</label>
                <div class="arr-row">
                    <input type="number" placeholder="min" data-k="arrMin" oninput={onArr} value={arrMin}>
                    <span>to</span>
                    <input type="number" placeholder="max" data-k="arrMax" oninput={onArr} value={arrMax}>
                </div>
            </div>
            <div class="f search"><label>Search</label>
                <input type="text" placeholder="Account or opp name" oninput={onSearch} value={search}>
            </div>
            <label class="chk"><input type="checkbox" checked={mismatchOnly} onchange={onMismatch}> Only mismatches</label>
        </div>
    </div>
</template>
