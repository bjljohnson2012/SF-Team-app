<template>
    <div class="bar">
        <label class="chk"><input type="checkbox" checked={changedOnly} onchange={onChanged}> Only changed</label>
        <div class="f">
            <label>Saved view</label>
            <select onchange={onPick}>
                <option value="">— none —</option>
                <template for:each={views} for:item="v"><option key={v.id} value={v.id}>{v.name}</option></template>
            </select>
        </div>
        <button class="btn" onclick={onSave}>Save</button>
        <button class="btn" onclick={onDel}>Del</button>
        <button class="btn" onclick={onReset}>Reset filters</button>
        <button class="btn" onclick={onRefresh}>Refresh from Salesforce</button>
    </div>
</template>
