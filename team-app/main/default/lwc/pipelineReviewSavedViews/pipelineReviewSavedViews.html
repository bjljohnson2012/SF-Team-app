<template>
    <div class="pr-filters">
        <div class="pr-f"><label>Saved views</label>
            <select onchange={onPick}>
                <option value="">—</option>
                <template for:each={views} for:item="v"><option key={v.id} value={v.id}>{v.name}</option></template>
            </select>
        </div>
        <button class="btn" onclick={onSave}>Save view</button>
        <button class="btn ghost" onclick={onDup}>Duplicate</button>
        <button class="btn ghost" onclick={onDel}>Delete</button>
    </div>
</template>
